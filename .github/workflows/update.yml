name: Actualiza Scout DB 26-27
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scouty.py
      - run: |
          git config user.name "Scout Bot"
          git config user.email "bot@scout-db.com"
          git add .
          git commit -m "Update 26/27" || echo "sin cambios"
          git push
